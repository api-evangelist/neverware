name: Neverware
description: 'Neverware was a New York-based software company, backed by Thrive Capital,
  best known for CloudReady — a ChromiumOS-based operating system that converted aging
  PCs and Macs into fast, secure, cloud-first Chromebook-like endpoints for schools
  and enterprises. Google acquired Neverware and folded CloudReady into ChromeOS Flex:
  the neverware.com domain now 301-redirects to Google''s ChromeOS Flex product pages
  (chromeos.google/products/chromeos-flex) and its certificate issuance is controlled
  by Google (CAA pki.goog). The company operates no standalone public developer API,
  SDK, or documentation surface today.'
